services:
  bolt:
    image: bolt-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production

    # В Dokploy лучше держать порт из переменной
    ports:
      - "${PORT:-5173}:5173"

    environment:
      NODE_ENV: "production"
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      VITE_LOG_LEVEL: "${VITE_LOG_LEVEL:-info}"
      DEFAULT_NUM_CTX: "${DEFAULT_NUM_CTX:-32768}"

      # LLM провайдеры (опционально, включай что используешь)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPEN_ROUTER_API_KEY: "${OPEN_ROUTER_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      TOGETHER_API_BASE_URL: "${TOGETHER_API_BASE_URL:-}"

      # Локальная Ollama (если используешь на хосте)
      # Внутри контейнера "127.0.0.1" НЕ хост, поэтому используем host.docker.internal
      OLLAMA_API_BASE_URL: "${OLLAMA_API_BASE_URL:-http://host.docker.internal:11434}"

      # Если реально используешь Bedrock (обычно нет)
      AWS_BEDROCK_CONFIG: "${AWS_BEDROCK_CONFIG:-}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: pnpm run dockerstart
    restart: unless-stopped